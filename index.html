<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020704" />
  <title>404 — Temporarily Offline</title>
  <style>
    :root {
      --green: #39ff88;
      --green-soft: #9dffc1;
      --muted: #8ab89a;
      --bg: #020704;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      background: var(--bg);
      color: #effff4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #space {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; z-index: 0;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 0%, rgba(0,8,3,.12) 45%, rgba(0,0,0,.72) 100%),
        linear-gradient(180deg, rgba(0,0,0,.12), transparent 40%, rgba(0,0,0,.28));
    }
    .scanlines {
      position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: .12;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(57,255,136,.12) 4px, transparent 5px);
      mix-blend-mode: screen;
    }
    .frame {
      position: fixed; inset: 24px; z-index: 4; pointer-events: none; opacity: .72;
      border: 1px solid rgba(57,255,136,.13);
      clip-path: polygon(0 0, 25% 0, 26% 1px, 74% 1px, 75% 0, 100% 0, 100% 100%, 75% 100%, 74% calc(100% - 1px), 26% calc(100% - 1px), 25% 100%, 0 100%);
    }
    .frame::before, .frame::after {
      content: ""; position: absolute; width: 38px; height: 38px;
      border-color: var(--green); border-style: solid; opacity: .8;
    }
    .frame::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
    .frame::after { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
    .corner {
      position: fixed; z-index: 4; width: 14px; height: 14px; border: 1px solid var(--green);
      border-radius: 50%; opacity: .8; pointer-events: none;
      box-shadow: 0 0 12px rgba(57,255,136,.35);
    }
    .corner::before, .corner::after { content: ""; position: absolute; background: var(--green); opacity: .65; }
    .corner::before { width: 32px; height: 1px; left: -10px; top: 6px; }
    .corner::after { width: 1px; height: 32px; top: -10px; left: 6px; }
    .tl { top: 28px; left: 28px; } .tr { top: 28px; right: 28px; }
    .bl { bottom: 28px; left: 28px; } .br { bottom: 28px; right: 28px; }
    main {
      position: relative; z-index: 5; min-height: 100svh; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .content {
      width: min(900px, 100%); text-align: center; transform: translateY(1vh);
      animation: contentIn 1.2s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px; margin-bottom: 8px;
      color: var(--green); font: 600 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .28em; text-transform: uppercase; opacity: .85;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 12px var(--green); animation: blink 1.6s steps(2, start) infinite;
    }
    .error {
      position: relative; display: inline-block; margin: 0;
      font-size: clamp(6.5rem, 21vw, 17rem); line-height: .92;
      font-weight: 900; letter-spacing: -.085em; padding-right: .085em;
      color: #d8ffe6; background: linear-gradient(180deg, #f1fff5 3%, #8dffb5 44%, #20dc71 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(57,255,136,.28));
      animation: breathe 4s ease-in-out infinite;
      isolation: isolate;
    }
    .error::before, .error::after {
      content: "404"; position: absolute; inset: 0; pointer-events: none;
      -webkit-text-fill-color: #39ff88; background: none; opacity: 0;
    }
    .error::before { transform: translateX(-3px); text-shadow: 2px 0 #00ff95; animation: glitchA 5.4s infinite steps(1,end); }
    .error::after { transform: translateX(3px); text-shadow: -2px 0 #b2ffd0; animation: glitchB 5.4s infinite steps(1,end); }
    h2 {
      margin: clamp(18px, 3.4vh, 34px) 0 0; color: #dffff0;
      font-size: clamp(1rem, 2.5vw, 1.45rem); font-weight: 650;
      letter-spacing: clamp(.25em, 1.1vw, .55em); text-indent: .45em;
      text-shadow: 0 0 18px rgba(57,255,136,.22);
    }
    .rule {
      width: min(300px, 58vw); height: 1px; margin: 26px auto 25px; position: relative;
      background: linear-gradient(90deg, transparent, rgba(57,255,136,.8), transparent);
    }
    .rule::after {
      content: "✦"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-53%);
      padding: 0 12px; color: var(--green); background: transparent;
      text-shadow: 0 0 12px var(--green); font-size: 15px;
      animation: sparkle 3s ease-in-out infinite;
    }
    .contacts {
      display: flex; align-items: center; justify-content: center; gap: clamp(18px, 4vw, 48px);
    }
    .contact {
      color: #e7fff0; text-decoration: none; display: inline-flex; align-items: center;
      gap: 12px; padding: 10px 12px; border-radius: 8px;
      transition: color .25s ease, background .25s ease, transform .25s ease;
      font-size: clamp(.8rem, 1.5vw, .98rem);
    }
    .contact:hover, .contact:focus-visible {
      color: var(--green); background: rgba(57,255,136,.07); transform: translateY(-2px);
      outline: none;
    }
    .contact svg { width: 27px; height: 27px; flex: 0 0 auto; color: var(--green); filter: drop-shadow(0 0 7px rgba(57,255,136,.28)); }
    .separator { width: 1px; height: 40px; background: linear-gradient(transparent, rgba(57,255,136,.65), transparent); }
    .footer {
      margin-top: clamp(28px, 5vh, 50px); color: rgba(138,184,154,.52);
      font: 9px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .22em;
    }
    @keyframes contentIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(1vh); } }
    @keyframes breathe { 0%,100% { filter: drop-shadow(0 0 14px rgba(57,255,136,.22)); } 50% { filter: drop-shadow(0 0 27px rgba(57,255,136,.42)); } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%,100% { opacity: .3; } }
    @keyframes sparkle { 0%,100% { opacity: .65; transform: translate(-50%,-53%) scale(.88); } 50% { opacity: 1; transform: translate(-50%,-53%) scale(1.18); } }
    @keyframes glitchA {
      0%, 87%, 89%, 93%, 100% { opacity: 0; clip-path: inset(0 0 100% 0); }
      88% { opacity: .8; clip-path: inset(20% 0 58% 0); }
      90% { opacity: .65; clip-path: inset(62% 0 16% 0); }
      92% { opacity: .75; clip-path: inset(42% 0 43% 0); }
    }
    @keyframes glitchB {
      0%, 86%, 88%, 94%, 100% { opacity: 0; clip-path: inset(100% 0 0 0); }
      87% { opacity: .65; clip-path: inset(54% 0 28% 0); }
      89% { opacity: .85; clip-path: inset(12% 0 70% 0); }
      93% { opacity: .55; clip-path: inset(74% 0 8% 0); }
    }
    @media (max-width: 560px) {
      .frame { inset: 12px; }
      .corner { transform: scale(.72); }
      .tl { top: 15px; left: 15px; } .tr { top: 15px; right: 15px; }
      .bl { bottom: 15px; left: 15px; } .br { bottom: 15px; right: 15px; }
      main { padding: 24px 18px; }
      .content { transform: translateY(0); }
      .error { font-size: clamp(6.2rem, 28vw, 10rem); }
      h2 { letter-spacing: .22em; text-indent: .22em; }
      .contacts { gap: 8px; }
      .contact { flex-direction: column; gap: 7px; padding: 9px 5px; font-size: .75rem; }
      .contact svg { width: 25px; height: 25px; }
      .separator { height: 48px; }
      .rule { margin: 23px auto 18px; }
      .footer { margin-top: 27px; letter-spacing: .12em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>
  <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
  <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>

  <main>
    <section class="content" aria-labelledby="headline">
      <div class="eyebrow"><span class="status-dot"></span> Signal lost</div>
      <h1 class="error" aria-label="404">404</h1>
      <h2 id="headline">TEMPORARILY OFFLINE</h2>
      <div class="rule" aria-hidden="true"></div>

      <nav class="contacts" aria-label="Contact links">
        <a class="contact" href="https://zalo.me/0369587039" target="_blank" rel="noopener noreferrer" aria-label="Contact via Zalo">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 3.5c-7 0-12.5 4.8-12.5 10.8 0 3.4 1.8 6.4 4.7 8.3l-.9 5 5.2-2.4c1.1.3 2.3.4 3.5.4 7 0 12.5-4.8 12.5-10.8S23 3.5 16 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9.5 12.3h5.2l-5.2 5.4h5.5M18 12.3h4.7l-4.7 5.4h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>zalo.me/0369587039</span>
        </a>
        <span class="separator" aria-hidden="true"></span>
        <a class="contact" href="https://Huuanh.shop" target="_blank" rel="noopener noreferrer" aria-label="Open Huuanh.shop">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle cx="16" cy="16" r="12.5" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3.8 16h24.4M16 3.5c3.5 3.5 5.3 7.7 5.3 12.5S19.5 25 16 28.5C12.5 25 10.7 20.8 10.7 16S12.5 7 16 3.5Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6.5 8.5h19M6.5 23.5h19" stroke="currentColor" stroke-width="1.2" opacity=".7"/>
          </svg>
          <span>Huuanh.shop</span>
        </a>
      </nav>
      <div class="footer">TEMPORARY MAINTENANCE</div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d', { alpha: false });
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w = 0, h = 0, dpr = 1, stars = [], dust = [], rocks = [];
      let last = 0, elapsed = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.7);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = Array.from({length: Math.min(240, Math.floor(w*h/4500))}, () => ({
          x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.35+.15,
          a: Math.random()*.65+.15, p: Math.random()*Math.PI*2, s: Math.random()*.8+.2
        }));
        dust = Array.from({length: Math.min(100, Math.floor(w*h/10000))}, () => ({
          x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.6+.3,
          v: Math.random()*.18+.04, a: Math.random()*.35+.08
        }));
        rocks = Array.from({length: Math.max(5, Math.min(10, Math.floor(w/170)))}, () => ({
          x: Math.random()*w, y: h*(.18+Math.random()*.72), r: Math.random()*5+2,
          rot: Math.random()*6.28, v: (Math.random()-.5)*.002
        }));
      }
      function glow(x,y,r,color,blur) {
        const g = ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
      function drawBlackHole(t) {
        const cx = w*.5, cy = h*.39, scale = Math.min(w,h)*.29;
        ctx.save(); ctx.translate(cx,cy);
        // diffuse green nebula around the event horizon
        glow(0,0,scale*1.9,'rgba(0,255,100,.055)',22);
        glow(-scale*.3,scale*.28,scale*1.25,'rgba(0,255,100,.045)',30);

        // Rotating accretion disk, rendered as many elliptical orbital strokes.
        ctx.save(); ctx.rotate(-.14 + Math.sin(t*.00013)*.035);
        for (let i=0;i<5;i++) {
          ctx.beginPath();
          ctx.ellipse(0,0,scale*(1.18+i*.115),scale*(.30+i*.026),0,Math.PI*(.08+i*.025),Math.PI*(1.08+i*.025));
          ctx.strokeStyle = `rgba(${30+i*4},255,${100+i*10},${.09+i*.035})`;
          ctx.lineWidth = 1.2 + i*.25; ctx.shadowBlur = 15; ctx.shadowColor = '#00ff66'; ctx.stroke();
        }
        for (let i=0;i<34;i++) {
          const a = t*.00017 + i*.185;
          const rx = scale*(.72 + (i%9)*.085), ry = scale*(.20 + (i%9)*.023);
          const x = Math.cos(a)*rx, y = Math.sin(a)*ry;
          ctx.fillStyle = `rgba(75,255,145,${.08+(i%5)*.045})`;
          ctx.beginPath(); ctx.ellipse(x,y,scale*.025,scale*.008,a,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();

        // Event horizon and luminous rim.
        glow(0,0,scale*.72,'rgba(0,0,0,.95)',3);
        ctx.beginPath(); ctx.arc(0,0,scale*.48,0,Math.PI*2);
        ctx.fillStyle = '#010302'; ctx.fill();
        ctx.beginPath(); ctx.arc(0,0,scale*.495,0,Math.PI*2);
        ctx.strokeStyle = 'rgba(80,255,145,.38)'; ctx.lineWidth = 2;
        ctx.shadowBlur = 22; ctx.shadowColor = '#00ff66'; ctx.stroke();

        // Orbit trails pass in front and behind the black hole.
        ctx.rotate(.17);
        for (let i=0;i<3;i++) {
          ctx.beginPath();
          ctx.ellipse(0,0,scale*(1.28+i*.15),scale*(.34+i*.04),0,Math.PI*.05,Math.PI*.96);
          ctx.strokeStyle = `rgba(48,255,132,${.25-i*.055})`;
          ctx.lineWidth = i===0 ? 1.5 : .8; ctx.stroke();
        }
        ctx.restore();
      }
      function drawGround(t) {
        const y = h*.84;
        const g = ctx.createLinearGradient(0,y-50,0,h);
        g.addColorStop(0,'rgba(0,255,100,0)');
        g.addColorStop(.45,'rgba(0,90,35,.09)');
        g.addColorStop(1,'rgba(0,0,0,.82)');
        ctx.fillStyle=g; ctx.fillRect(0,y-50,w,h-y+50);
        ctx.beginPath(); ctx.moveTo(0,y+h*.02);
        ctx.bezierCurveTo(w*.23,y-h*.11,w*.25,y+h*.17,w*.52,y+h*.04);
        ctx.bezierCurveTo(w*.76,y-h*.07,w*.82,y+h*.12,w,y-h*.01);
        ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
        ctx.fillStyle='rgba(0,8,4,.7)'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(0,y+h*.02);
        ctx.bezierCurveTo(w*.23,y-h*.11,w*.25,y+h*.17,w*.52,y+h*.04);
        ctx.bezierCurveTo(w*.76,y-h*.07,w*.82,y+h*.12,w,y-h*.01);
        ctx.strokeStyle='rgba(57,255,136,.23)'; ctx.lineWidth=1; ctx.stroke();
        for(let i=0;i<24;i++){
          const x=(i/24*w + (t*.008)% (w/24))%w;
          const yy=y+Math.sin(i*2.1)*h*.035;
          ctx.fillStyle=`rgba(57,255,136,${.12+(i%4)*.08})`;
          ctx.fillRect(x,yy,Math.random()*2+1,Math.random()*5+1);
        }
      }
      function draw(t) {
        ctx.fillStyle='#020704'; ctx.fillRect(0,0,w,h);
        // subtle green cloud bands
        glow(w*.18,h*.22,Math.max(w,h)*.42,'rgba(0,90,35,.13)',55);
        glow(w*.83,h*.68,Math.max(w,h)*.38,'rgba(0,125,48,.12)',50);
        stars.forEach(s=>{
          const twinkle = reduceMotion ? 1 : .55 + .45*Math.sin(t*.001*s.s+s.p);
          ctx.globalAlpha=s.a*twinkle; ctx.fillStyle='#baffd0';
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
          if(s.r>1.15){
            ctx.strokeStyle=`rgba(57,255,136,${.25*twinkle})`; ctx.lineWidth=.5;
            ctx.beginPath(); ctx.moveTo(s.x-4,s.y); ctx.lineTo(s.x+4,s.y);
            ctx.moveTo(s.x,s.y-4); ctx.lineTo(s.x,s.y+4); ctx.stroke();
          }
        });
        ctx.globalAlpha=1;
        dust.forEach(p=>{
          if(!reduceMotion){ p.y -= p.v; if(p.y<0){p.y=h;p.x=Math.random()*w;} }
          ctx.fillStyle=`rgba(57,255,136,${p.a})`; ctx.fillRect(p.x,p.y,p.r,p.r);
        });
        drawBlackHole(t);
        rocks.forEach(r=>{
          if(!reduceMotion) r.rot+=r.v;
          ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.rot);
          ctx.beginPath();
          for(let i=0;i<7;i++){
            const a=i*Math.PI*2/7, rad=r.r*(.72+(i%3)*.2);
            const x=Math.cos(a)*rad,y=Math.sin(a)*rad;
            if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
          }
          ctx.closePath(); ctx.fillStyle='rgba(0,5,2,.9)';ctx.fill();
          ctx.strokeStyle='rgba(57,255,136,.24)';ctx.lineWidth=.7;ctx.stroke();
          ctx.restore();
        });
        drawGround(t);
        // occasional thin data streaks
        if(!reduceMotion && Math.sin(t*.0017)>.985){
          const y=Math.random()*h*.75;
          ctx.fillStyle='rgba(57,255,136,.55)';ctx.fillRect(Math.random()*w,y,Math.random()*100+20,1);
        }
      }
      function frame(now) {
        if(!last) last=now;
        const dt=Math.min(40,now-last); last=now; elapsed+=dt;
        draw(reduceMotion ? 0 : elapsed);
        if(!reduceMotion) requestAnimationFrame(frame);
      }
      resize();
      requestAnimationFrame(frame);
      window.addEventListener('resize', resize, {passive:true});
    })();
  </script>
</body>
</html>
