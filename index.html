<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Blockborne: Pixel Dungeons - 2D Meadow & Forest Edition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #27ae60;
    font-family: 'Courier New', monospace, sans-serif;
    color: #ffffff;
    touch-action: none;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e824c;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #55efc4;
  }

  /* HUD Top Bar */
  #top-hud {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    left: env(safe-area-inset-left, 12px);
    right: env(safe-area-inset-right, 12px);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  .hud-panel {
    background: rgba(24, 38, 28, 0.92);
    border: 3px solid #2ecc71;
    border-radius: 8px;
    padding: 6px 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .bar-container {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
    font-size: 11px;
    font-weight: 900;
  }
  .bar-track {
    width: 125px;
    height: 10px;
    background: #111e15;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #27ae60;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.15s ease-out;
  }
  .hp-fill { background: linear-gradient(90deg, #e74c3c, #ff7675); }
  .soul-fill { background: linear-gradient(90deg, #0984e3, #00cec9); }
  .exp-fill { background: linear-gradient(90deg, #f1c40f, #f39c12); }

  .stats-info {
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    display: flex;
    gap: 12px;
    text-shadow: 1px 1px 0 #000;
  }
  .stat-lvl { color: #f1c40f; }
  .stat-floor { color: #74b9ff; }
  .stat-emerald { color: #2ecc71; }

  /* Perks Tray */
  #perks-tray {
    position: absolute;
    top: env(safe-area-inset-top, 74px);
    left: env(safe-area-inset-left, 12px);
    right: 120px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    pointer-events: none;
    z-index: 15;
  }
  .perk-badge {
    background: rgba(20, 36, 25, 0.92);
    border: 2px solid #f1c40f;
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 10px;
    font-weight: 900;
    color: #ffd32a;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    white-space: nowrap;
  }

  /* Mobile Controls Layer */
  #controls-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }

  /* Virtual Joystick */
  #joystick-zone {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 45%;
    height: 70%;
    pointer-events: auto;
  }
  #joystick-base {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(20,40,25,0.7) 100%);
    border: 3px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    transform: translate(-50%, -50%);
    display: none;
    pointer-events: none;
  }
  #joystick-knob {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, #55efc4, #00b894);
    border: 3px solid #ffffff;
    box-shadow: 0 0 12px rgba(0,184,148,0.8);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Right Action Cluster */
  #actions-zone {
    position: absolute;
    right: env(safe-area-inset-right, 16px);
    bottom: env(safe-area-inset-bottom, 16px);
    width: 240px;
    height: 240px;
    pointer-events: none;
  }
  .ctrl-btn {
    position: absolute;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    pointer-events: auto;
    touch-action: none;
    overflow: hidden;
    text-shadow: 1px 1px 0 #000;
  }
  .ctrl-btn:active {
    transform: scale(0.91);
    filter: brightness(1.2);
  }
  .ctrl-btn span.label {
    font-size: 10px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  .ctrl-btn span.icon {
    font-size: 20px;
    margin-bottom: 2px;
    pointer-events: none;
  }

  #btn-melee {
    width: 78px;
    height: 78px;
    right: 20px;
    bottom: 30px;
    background: radial-gradient(circle, #ff7675, #d63031);
    border: 3px solid #ff7675;
  }
  #btn-bow {
    width: 60px;
    height: 60px;
    right: 110px;
    bottom: 24px;
    background: radial-gradient(circle, #55efc4, #00b894);
    border: 2px solid #55efc4;
  }
  #btn-roll {
    width: 60px;
    height: 60px;
    right: 18px;
    bottom: 122px;
    background: radial-gradient(circle, #74b9ff, #0984e3);
    border: 2px solid #74b9ff;
  }
  #btn-potion {
    width: 50px;
    height: 50px;
    right: 96px;
    bottom: 98px;
    background: radial-gradient(circle, #fd79a8, #e84393);
    border: 2px solid #fd79a8;
  }

  /* Artifacts */
  #artifacts-bar {
    position: absolute;
    right: env(safe-area-inset-right, 16px);
    bottom: 245px;
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  .art-btn {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: rgba(22, 38, 28, 0.92);
    border: 2px solid #2ecc71;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 9px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    text-shadow: 1px 1px 0 #000;
  }
  .art-btn:active {
    transform: scale(0.92);
  }
  .art-btn span.art-icon {
    font-size: 18px;
  }
  .cd-mask {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.75);
    height: 0%;
    pointer-events: none;
    transition: height 0.08s linear;
  }

  /* Modals */
  .modal-screen {
    position: absolute;
    inset: 0;
    background: rgba(14, 28, 18, 0.92);
    backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 60;
    text-align: center;
    padding: 16px;
  }
  #levelup-title {
    font-size: 26px;
    font-weight: 900;
    color: #ffd32a;
    text-shadow: 0 0 16px rgba(255, 211, 42, 0.85);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  #levelup-subtitle {
    font-size: 13px;
    color: #a4b0be;
    margin-bottom: 18px;
  }
  #cards-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 400px;
    max-height: 70vh;
    overflow-y: auto;
  }
  @media (min-width: 768px) {
    #cards-container {
      flex-direction: row;
      max-width: 820px;
      max-height: none;
    }
  }
  .skill-card {
    background: linear-gradient(145deg, #233e2b, #15261a);
    border: 2px solid #2ecc71;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    transition: transform 0.12s, border-color 0.12s;
    text-align: left;
    touch-action: manipulation;
  }
  .skill-card:active {
    transform: scale(0.96);
    border-color: #ffd32a;
    box-shadow: 0 0 20px rgba(255, 211, 42, 0.6);
  }
  .card-icon {
    font-size: 32px;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    flex-shrink: 0;
  }
  .card-content h3 {
    font-size: 15px;
    font-weight: 900;
    color: #f1f2f6;
    margin-bottom: 4px;
    text-shadow: 1px 1px 0 #000;
  }
  .card-content p {
    font-size: 12px;
    color: #c8d1de;
    line-height: 1.4;
  }

  /* Game Over */
  #modal-gameover-title {
    font-size: 26px;
    font-weight: 900;
    color: #e74c3c;
    margin-bottom: 12px;
    text-shadow: 0 0 16px rgba(231, 76, 60, 0.7);
  }
  #modal-gameover-desc {
    font-size: 15px;
    color: #dcdde1;
    margin-bottom: 24px;
    max-width: 380px;
    line-height: 1.5;
  }
  .big-btn {
    background: linear-gradient(135deg, #00b894, #0984e3);
    color: white;
    border: none;
    padding: 14px 34px;
    font-size: 17px;
    font-weight: 900;
    border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0, 184, 148, 0.5);
    cursor: pointer;
  }
  .big-btn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>

  <!-- Top HUD -->
  <div id="top-hud">
    <div class="hud-panel">
      <div class="bar-container">
        <span>HP</span>
        <div class="bar-track"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
      </div>
      <div class="bar-container">
        <span>HỒN</span>
        <div class="bar-track"><div id="soul-bar" class="bar-fill soul-fill"></div></div>
      </div>
      <div class="bar-container" style="margin-bottom:0;">
        <span>EXP</span>
        <div class="bar-track"><div id="exp-bar" class="bar-fill exp-fill" style="width:0%;"></div></div>
      </div>
    </div>
    <div class="hud-panel stats-info">
      <div class="stat-lvl">⭐ CẤP <span id="txt-lvl">1</span></div>
      <div class="stat-floor">TẦNG <span id="txt-floor">1</span></div>
      <div class="stat-emerald">💎 <span id="txt-emerald">0</span></div>
    </div>
  </div>

  <div id="perks-tray"></div>

  <!-- Mobile Controls -->
  <div id="controls-layer">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>

    <div id="artifacts-bar">
      <div class="art-btn" id="art-1">
        <span class="art-icon">🍄</span>
        <span>NẤM</span>
        <div class="cd-mask" id="cd-art-1"></div>
      </div>
      <div class="art-btn" id="art-2">
        <span class="art-icon">⚡</span>
        <span>NỔ HỒN</span>
        <div class="cd-mask" id="cd-art-2"></div>
      </div>
      <div class="art-btn" id="art-3">
        <span class="art-icon">🔮</span>
        <span>LASER</span>
        <div class="cd-mask" id="cd-art-3"></div>
      </div>
    </div>

    <div id="actions-zone">
      <div class="ctrl-btn" id="btn-melee">
        <span class="icon">⚔️</span>
        <span class="label">CHÉM</span>
      </div>
      <div class="ctrl-btn" id="btn-bow">
        <span class="icon">🏹</span>
        <span class="label">BẮN</span>
      </div>
      <div class="ctrl-btn" id="btn-roll">
        <span class="icon">💨</span>
        <span class="label">LỘN</span>
        <div class="cd-mask" id="cd-roll"></div>
      </div>
      <div class="ctrl-btn" id="btn-potion">
        <span class="icon">🧪</span>
        <span class="label">MÁU</span>
        <div class="cd-mask" id="cd-pot"></div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="modal-levelup" class="modal-screen">
    <div id="levelup-title">LÊN CẤP CHIẾN BINH!</div>
    <div id="levelup-subtitle">Chọn 1 trong 3 kỹ năng cổ xưa để cường hóa:</div>
    <div id="cards-container"></div>
  </div>

  <div id="modal-gameover" class="modal-screen">
    <div id="modal-gameover-title">BẠN ĐÃ GỤC NGÃ!</div>
    <div id="modal-gameover-desc">Quái vật quá đông. Hãy thử lại nào!</div>
    <button class="big-btn" id="btn-revive">HỒI SINH & TIẾP TỤC</button>
  </div>
</div>

<script>
// --- Audio Synth Engine ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  playSlash() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(340, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.1);
  },
  playBow() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
  },
  playBlast() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.26, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  },
  playPickup() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(580, this.ctx.currentTime);
    osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.16);
  },
  playLevelUp() {
    if (!this.ctx) return;
    const notes = [330, 415, 493, 660];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
      gain.gain.setValueAtTime(0.22, this.ctx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.18);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.08);
      osc.stop(this.ctx.currentTime + idx * 0.08 + 0.18);
    });
  }
};

// --- 15+ Skills Database ---
const SKILL_DATABASE = [
  { id: 'multishot', title: 'Mũi Tên Đa Hướng (Multishot)', icon: '🏹', desc: 'Cung tên bắn 3 mũi tên tỏa rộng theo hình quạt.' },
  { id: 'firework', title: 'Tên Pháo Hoa (Firework Arrow)', icon: '🎆', desc: 'Mũi tên phát nổ pháo hoa cực lớn, sát thương diện rộng khi va chạm.' },
  { id: 'thunder', title: 'Sấm Sét Cổ Đại (Thundering)', icon: '⚡', desc: 'Mỗi cú chém cận chiến giật tia sét xích lan sang kẻ địch kế bên.' },
  { id: 'stormCall', title: 'Thiên Lôi Giáng Lâm (Call of Storm)', icon: '⛈️', desc: 'Cứ mỗi 3 giây tự động giáng một cột sét tử thần xuống đầu quái gần nhất.' },
  { id: 'swirling', title: 'Lốc Xoáy Cuồng Nộ (Swirling Blade)', icon: '🌀', desc: 'Mỗi cú chém tạo vòng bão kiếm 360 độ quét sạch quái vật xung quanh.' },
  { id: 'crit', title: 'Trảm Kích Chí Mạng (Critical Strike)', icon: '💥', desc: '25% tỷ lệ gây sát thương x3 cực lớn với hiệu ứng nổ cam.' },
  { id: 'glaive', title: 'Phi Kiếm Hộ Thân (Spectral Glaive)', icon: '🪓', desc: 'Triệu hồi ma kiếm pixel bay xoay tròn liên tục quanh bạn, chém quái lại gần.' },
  { id: 'corpseExplode', title: 'Xác Nổ Liên Hoàn (Corpse Explosion)', icon: '💣', desc: 'Quái vật chết sẽ phát nổ tung xác gây sát thương lớn cho quái xung quanh.' },
  { id: 'freezing', title: 'Băng Phong Hàn Băng (Frost Aspect)', icon: '❄️', desc: 'Đòn đánh đóng băng làm chậm 65% tốc độ di chuyển và bắn của quái.' },
  { id: 'fire', title: 'Lửa Địa Ngục (Fire Aspect)', icon: '🔥', desc: 'Vũ khí thiêu đốt kẻ địch, rút máu liên tục trong 3 giây.' },
  { id: 'poisonCloud', title: 'Mây Độc Tử Thần (Poison Cloud)', icon: '☠️', desc: 'Đòn đánh có 35% tạo vùng khí độc xanh lục rút máu liên hồi.' },
  { id: 'leech', title: 'Quang Năng Hồi Phục (Radiance)', icon: '💖', desc: 'Đòn đánh có 35% tạo hào quang ánh sáng hồi ngay 14 HP.' },
  { id: 'swiftness', title: 'Giày Phong Thần (Swiftfooted)', icon: '👟', desc: 'Tăng 22% tốc độ chạy và giảm 35% thời gian hồi chiêu Lộn nhào.' },
  { id: 'thorns', title: 'Giáp Kim Cương (Iron Hide)', icon: '🛡️', desc: 'Giảm 25% sát thương gánh chịu và phản 18 sát thương lên kẻ va chạm.' },
  { id: 'soulHarvest', title: 'Hút Linh Hồn (Soul Siphon)', icon: '🔮', desc: 'Thu thập gấp đôi Linh Hồn và hồi ngay 20 HP mỗi khi dùng Cổ vật.' }
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initMapDecoration();
}
window.addEventListener('resize', resize);

// Player State
const player = {
  x: 0, y: 0,
  size: 26,
  hp: 150, maxHp: 150,
  souls: 50, maxSouls: 100,
  exp: 0, maxExp: 40, level: 1,
  emeralds: 0,
  weaponTier: 1,
  speed: 3.6,
  facing: { x: 1, y: 0 },
  vx: 0, vy: 0,
  walkCycle: 0,
  rollTime: 0, rollCd: 0, maxRollCd: 40,
  invulnTime: 0,
  meleeCd: 0, bowCd: 0,
  shroomBuff: 0,
  beaconTime: 0,
  cdArt1: 0, maxCdArt1: 300,
  cdArt2: 0, maxCdArt2: 180,
  cdArt3: 0, maxCdArt3: 240,
  potCd: 0, maxPotCd: 360,
  stormTimer: 0,
  glaiveAngle: 0,
  perks: {}
};
SKILL_DATABASE.forEach(s => player.perks[s.id] = 0);

// World State
let dungeonFloor = 1;
let trees = [];
let flowers = [];
let stones = [];
let enemies = [];
let projectiles = [];
let particles = [];
let drops = [];
let slashArcs = [];
let lightningArcs = [];
let poisonClouds = [];
let floatingTexts = [];
let gameOver = false;
let isLevelingUp = false;

// BRIGHT SUNNY MEADOW / FOREST DECORATIONS
function initMapDecoration() {
  trees = [];
  flowers = [];
  stones = [];

  // Generate trees with healthy green foliage
  const treeCount = Math.floor((W * H) / 38000) + 8;
  for (let i = 0; i < treeCount; i++) {
    const tx = Math.random() * (W - 140) + 70;
    const ty = Math.random() * (H - 140) + 70;
    trees.push({
      x: tx, y: ty,
      size: Math.random() > 0.5 ? 36 : 28,
      shade: Math.random() > 0.5 ? '#27ae60' : '#2ecc71',
      darkShade: '#1e824c'
    });
  }

  // Generate cute pixel flowers and grass tufts
  const flowerCount = Math.floor((W * H) / 12000) + 20;
  for (let i = 0; i < flowerCount; i++) {
    flowers.push({
      x: Math.random() * W,
      y: Math.random() * H,
      type: Math.floor(Math.random() * 4), // 0: yellow, 1: red, 2: white, 3: tall grass
      color: ['#ffd32a', '#ff4757', '#ffffff', '#26de81'][Math.floor(Math.random() * 4)]
    });
  }

  // Small cobblestone patches
  const stoneCount = Math.floor((W * H) / 45000) + 5;
  for (let i = 0; i < stoneCount; i++) {
    stones.push({
      x: Math.random() * W,
      y: Math.random() * H,
      w: Math.random() * 20 + 16,
      h: Math.random() * 14 + 12
    });
  }
}
resize();
player.x = W / 2;
player.y = H / 2;

function getClosestEnemy(maxDist = 9999) {
  let closest = null;
  let minDist = maxDist;
  for (const en of enemies) {
    const d = Math.hypot(en.x - player.x, en.y - player.y);
    if (d < minDist) {
      minDist = d;
      closest = en;
    }
  }
  return closest;
}

// ==========================================
// SPAWN MORE DIVERSE MONSTERS
// 1. Zombie
// 2. Skeleton Archer
// 3. Slime (Hop & Fast)
// 4. Creeper (Explodes when close!)
// 5. Spider (Fast jumping)
// 6. Witch / Necromancer (Shoots magic orbs)
// 7. Boss Golem
// ==========================================
function spawnFloorWave() {
  const scalingLevel = (dungeonFloor - 1) * 1.5 + (player.level - 1) * 1.2;
  const count = 4 + Math.floor(dungeonFloor * 1.6 + player.level * 0.9);

  for (let i = 0; i < count; i++) {
    let ex, ey;
    let attempts = 0;
    do {
      ex = Math.random() * (W - 140) + 70;
      ey = Math.random() * (H - 140) + 70;
      attempts++;
    } while (attempts < 50 && Math.hypot(ex - player.x, ey - player.y) < 200);

    const isBoss = (i === 0 && dungeonFloor % 3 === 0);
    const randType = Math.random();

    if (isBoss) {
      const bossHp = Math.round(250 + scalingLevel * 85);
      enemies.push({
        x: ex, y: ey, size: 54,
        hp: bossHp, maxHp: bossHp,
        speed: Math.min(2.1, 1.3 + scalingLevel * 0.06),
        type: 'boss',
        shootCd: Math.max(65, 110 - Math.floor(scalingLevel * 3)),
        burn: 0, freeze: 0, walkCycle: 0, facing: { x: -1, y: 0 }
      });
    } else if (randType < 0.25) {
      // 1. Grass Zombie
      const zHp = Math.round(28 + scalingLevel * 14);
      enemies.push({
        x: ex, y: ey, size: 26,
        hp: zHp, maxHp: zHp,
        speed: Math.min(2.6, 1.6 + scalingLevel * 0.08),
        type: 'zombie', burn: 0, freeze: 0, walkCycle: 0, facing: { x: -1, y: 0 }
      });
    } else if (randType < 0.45) {
      // 2. Skeleton Archer
      const sHp = Math.round(22 + scalingLevel * 10);
      enemies.push({
        x: ex, y: ey, size: 24,
        hp: sHp, maxHp: sHp,
        speed: Math.min(2.2, 1.35 + scalingLevel * 0.05),
        type: 'skeleton',
        shootCd: Math.max(70, 130 - Math.floor(scalingLevel * 4)) + Math.random() * 25,
        burn: 0, freeze: 0, walkCycle: 0, facing: { x: -1, y: 0 }
      });
    } else if (randType < 0.65) {
      // 3. Green Slime (Hops and bouncy)
      const slHp = Math.round(20 + scalingLevel * 9);
      enemies.push({
        x: ex, y: ey, size: 22,
        hp: slHp, maxHp: slHp,
        speed: Math.min(3.1, 2.0 + scalingLevel * 0.09),
        type: 'slime', hopTimer: 0, burn: 0, freeze: 0, walkCycle: 0, facing: { x: -1, y: 0 }
      });
    } else if (randType < 0.80) {
      // 4. Creeper (Explodes when getting close!)
      const cpHp = Math.round(24 + scalingLevel * 11);
      enemies.push({
        x: ex, y: ey, size: 26,
        hp: cpHp, maxHp: cpHp,
        speed: Math.min(2.8, 1.8 + scalingLevel * 0.08),
        type: 'creeper', fuse: 0, burn: 0, freeze: 0, walkCycle: 0, facing: { x: -1, y: 0 }
      });
    } else if (randType < 0.92) {
      // 5. Cave Spider (Fast lunging)
      const spHp = Math.round(18 + scalingLevel * 8);
      enemies.push({
        x: ex, y: ey, size: 22,
        hp: spHp, maxHp: spHp,
        speed: Math.min(3.4, 2.3 + scalingLevel * 0.1),
        type: 'spider', burn: 0, freeze: 0, walkCycle: 0, facing: { x: -1, y: 0 }
      });
    } else {
      // 6. Dark Witch / Necromancer (Spells from distance)
      const wHp = Math.round(26 + scalingLevel * 12);
      enemies.push({
        x: ex, y: ey, size: 26,
        hp: wHp, maxHp: wHp,
        speed: Math.min(2.0, 1.3 + scalingLevel * 0.04),
        type: 'witch',
        shootCd: Math.max(75, 120 - Math.floor(scalingLevel * 3)),
        burn: 0, freeze: 0, walkCycle: 0, facing: { x: -1, y: 0 }
      });
    }
  }
}

// Exp & Level Up (-5 exp as requested: 10 per mob, 40 per boss)
function addExp(amount) {
  player.exp += amount;
  if (player.exp >= player.maxExp) {
    player.exp -= player.maxExp;
    player.level++;
    player.maxExp = Math.floor(player.maxExp * 1.4);
    triggerLevelUpModal();
  }
}

function triggerLevelUpModal() {
  isLevelingUp = true;
  AudioEngine.playLevelUp();
  player.hp = Math.min(player.maxHp, player.hp + Math.floor(player.maxHp * 0.35));

  const shuffled = [...SKILL_DATABASE].sort(() => 0.5 - Math.random());
  const selected = shuffled.slice(0, 3);

  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  selected.forEach(skill => {
    const card = document.createElement('div');
    card.className = 'skill-card';
    card.innerHTML = `
      <div class="card-icon">${skill.icon}</div>
      <div class="card-content">
        <h3>${skill.title}</h3>
        <p>${skill.desc}</p>
      </div>
    `;
    card.addEventListener('click', () => chooseSkill(skill.id));
    card.addEventListener('touchend', (e) => {
      e.preventDefault();
      chooseSkill(skill.id);
    });
    container.appendChild(card);
  });

  document.getElementById('modal-levelup').style.display = 'flex';
}

function chooseSkill(skillId) {
  player.perks[skillId] = (player.perks[skillId] || 0) + 1;
  isLevelingUp = false;
  document.getElementById('modal-levelup').style.display = 'none';

  if (skillId === 'swiftness') {
    player.speed = 3.6 * 1.22;
    player.maxRollCd = 26;
  }
  updatePerksTray();
}

function updatePerksTray() {
  const tray = document.getElementById('perks-tray');
  tray.innerHTML = '';
  for (const [key, count] of Object.entries(player.perks)) {
    if (count > 0) {
      const sk = SKILL_DATABASE.find(s => s.id === key);
      if (sk) {
        const badge = document.createElement('div');
        badge.className = 'perk-badge';
        badge.innerText = `${sk.icon} ${sk.title.split(' ')[0]} x${count}`;
        tray.appendChild(badge);
      }
    }
  }
}

function spawnFloatingText(x, y, text, color = '#ffd32a') {
  floatingTexts.push({ x, y, text, color, life: 30, vy: -1.2 });
}

function applyDamage(en, baseDmg) {
  let isCrit = false;
  let dmg = baseDmg;

  if (player.perks.crit > 0 && Math.random() < 0.25) {
    isCrit = true;
    dmg *= 3;
    spawnFloatingText(en.x, en.y - 18, 'CHÍ MẠNG! ' + Math.round(dmg), '#ff3838');
    spawnParticles(en.x, en.y, '#ff4757', 14);
  } else {
    spawnFloatingText(en.x, en.y - 12, Math.round(dmg), isCrit ? '#ff4757' : '#ffd32a');
  }

  en.hp -= dmg;
  if (player.perks.freezing > 0) en.freeze = 90;
  if (player.perks.fire > 0) en.burn = 90;
  if (player.perks.poisonCloud > 0 && Math.random() < 0.35) {
    poisonClouds.push({ x: en.x, y: en.y, radius: 46, life: 120 });
  }
  return isCrit;
}

function doMelee() {
  AudioEngine.init();
  if (player.meleeCd > 0 || player.rollTime > 0 || isLevelingUp) return;
  player.meleeCd = player.shroomBuff > 0 ? 10 : 16;
  AudioEngine.playSlash();

  let target = getClosestEnemy(200);
  let aimAngle = Math.atan2(player.facing.y, player.facing.x);
  if (target) {
    aimAngle = Math.atan2(target.y - player.y, target.x - player.x);
    player.facing = { x: Math.cos(aimAngle), y: Math.sin(aimAngle) };
  }

  slashArcs.push({ x: player.x, y: player.y, angle: aimAngle, life: 10, swirling: false });
  if (player.perks.swirling > 0) {
    slashArcs.push({ x: player.x, y: player.y, angle: 0, life: 12, swirling: true });
  }

  let hitAny = false;
  enemies.forEach(en => {
    const dist = Math.hypot(en.x - player.x, en.y - player.y);
    const enAngle = Math.atan2(en.y - player.y, en.x - player.x);
    let diff = Math.abs(enAngle - aimAngle);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;

    const inRange = (player.perks.swirling > 0 && dist < 105) || (dist < 92 && diff < 1.3);
    if (inRange) {
      hitAny = true;
      const baseDmg = 34 + player.weaponTier * 10;
      applyDamage(en, baseDmg);

      en.x += Math.cos(aimAngle) * 36;
      en.y += Math.sin(aimAngle) * 36;
      spawnParticles(en.x, en.y, '#f1c40f', 6);

      if (player.perks.thunder > 0) {
        enemies.forEach(other => {
          if (other !== en && Math.hypot(other.x - en.x, other.y - en.y) < 140) {
            other.hp -= 20 * player.perks.thunder;
            lightningArcs.push({ x1: en.x, y1: en.y, x2: other.x, y2: other.y, life: 6 });
          }
        });
      }
    }
  });

  if (hitAny && player.perks.leech > 0 && Math.random() < 0.35) {
    player.hp = Math.min(player.maxHp, player.hp + 14 * player.perks.leech);
    spawnParticles(player.x, player.y, '#2ed573', 12);
    spawnFloatingText(player.x, player.y - 20, '+HỒI MÁU', '#2ed573');
  }
}

function doBow() {
  AudioEngine.init();
  if (player.bowCd > 0 || player.rollTime > 0 || isLevelingUp) return;
  player.bowCd = 20;
  AudioEngine.playBow();

  let target = getClosestEnemy(600);
  let aimAngle = Math.atan2(player.facing.y, player.facing.x);
  if (target) {
    aimAngle = Math.atan2(target.y - player.y, target.x - player.x);
    player.facing = { x: Math.cos(aimAngle), y: Math.sin(aimAngle) };
  }

  const count = player.perks.multishot > 0 ? 3 : 1;
  const spread = 0.22;
  for (let i = 0; i < count; i++) {
    const angleOffset = count === 1 ? 0 : (i - 1) * spread;
    const finalAngle = aimAngle + angleOffset;
    projectiles.push({
      x: player.x, y: player.y,
      vx: Math.cos(finalAngle) * 12, vy: Math.sin(finalAngle) * 12,
      dmg: 28 + player.weaponTier * 9, friendly: true,
      color: player.perks.firework > 0 ? '#ff4757' : '#f39c12',
      isFirework: player.perks.firework > 0
    });
  }
}

function doRoll() {
  if (player.rollCd > 0 || player.rollTime > 0 || isLevelingUp) return;
  let dx = joystickVector.x, dy = joystickVector.y;
  if (dx === 0 && dy === 0) {
    dx = player.facing.x;
    dy = player.facing.y;
  }
  const len = Math.hypot(dx, dy) || 1;
  player.vx = (dx / len) * 11;
  player.vy = (dy / len) * 11;
  player.rollTime = 14;
  player.rollCd = player.maxRollCd;
  player.invulnTime = 20;
  spawnParticles(player.x, player.y, '#ffffff', 8);
}

function doPotion() {
  AudioEngine.init();
  if (player.potCd <= 0 && player.hp < player.maxHp && !isLevelingUp) {
    player.hp = Math.min(player.maxHp, player.hp + 80);
    player.potCd = player.maxPotCd;
    spawnParticles(player.x, player.y, '#2ed573', 20);
    spawnFloatingText(player.x, player.y - 20, '+80 HP', '#2ed573');
  }
}

function useArtifact(num) {
  AudioEngine.init();
  if (isLevelingUp) return;

  if (player.perks.soulHarvest > 0) {
    player.hp = Math.min(player.maxHp, player.hp + 20);
    spawnParticles(player.x, player.y, '#00cec9', 10);
  }

  if (num === 1 && player.cdArt1 <= 0) {
    player.shroomBuff = 300;
    player.cdArt1 = player.maxCdArt1;
    spawnParticles(player.x, player.y, '#e67e22', 15);
  } else if (num === 2 && player.cdArt2 <= 0 && player.souls >= 15) {
    player.souls -= 15;
    player.cdArt2 = player.maxCdArt2;
    AudioEngine.playBlast();
    spawnParticles(player.x, player.y, '#00cec9', 40);
    enemies.forEach(en => {
      const d = Math.hypot(en.x - player.x, en.y - player.y);
      if (d < 190) {
        applyDamage(en, 80 + player.weaponTier * 20);
        const a = Math.atan2(en.y - player.y, en.x - player.x);
        en.x += Math.cos(a) * 65;
        en.y += Math.sin(a) * 65;
      }
    });
  } else if (num === 3 && player.cdArt3 <= 0 && player.souls >= 20) {
    player.souls -= 20;
    player.beaconTime = 120;
    player.cdArt3 = player.maxCdArt3;
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 4 + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22, color });
  }
}

// Touch Virtual Joystick
const joyZone = document.getElementById('joystick-zone');
const joyBase = document.getElementById('joystick-base');
const joyKnob = document.getElementById('joystick-knob');
let joystickTouchId = null;
let joystickCenter = { x: 0, y: 0 };
let joystickVector = { x: 0, y: 0 };
const JOYSTICK_RADIUS = 50;

joyZone.addEventListener('touchstart', e => {
  e.preventDefault();
  AudioEngine.init();
  if (joystickTouchId !== null || isLevelingUp) return;
  const touch = e.changedTouches[0];
  joystickTouchId = touch.identifier;
  joystickCenter = { x: touch.clientX, y: touch.clientY };
  joyBase.style.left = joystickCenter.x + 'px';
  joyBase.style.top = joystickCenter.y + 'px';
  joyBase.style.display = 'block';
  joyKnob.style.transform = `translate(-50%, -50%) translate(0px, 0px)`;
  joystickVector = { x: 0, y: 0 };
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (joystickTouchId === null || isLevelingUp) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      let dx = touch.clientX - joystickCenter.x;
      let dy = touch.clientY - joystickCenter.y;
      const dist = Math.hypot(dx, dy);
      if (dist > JOYSTICK_RADIUS) {
        dx = (dx / dist) * JOYSTICK_RADIUS;
        dy = (dy / dist) * JOYSTICK_RADIUS;
      }
      joyKnob.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
      joystickVector = { x: dx / JOYSTICK_RADIUS, y: dy / JOYSTICK_RADIUS };
      if (dist > 8) {
        player.facing = { x: dx / dist, y: dy / dist };
      }
      break;
    }
  }
}, { passive: false });

function resetJoystick() {
  joystickTouchId = null;
  joyBase.style.display = 'none';
  joystickVector = { x: 0, y: 0 };
}
window.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joystickTouchId) {
      resetJoystick();
      break;
    }
  }
});
window.addEventListener('touchcancel', resetJoystick);

function attachBtn(id, action) {
  const el = document.getElementById(id);
  const handler = e => { e.preventDefault(); action(); };
  el.addEventListener('touchstart', handler, { passive: false });
  el.addEventListener('mousedown', handler);
}

attachBtn('btn-melee', doMelee);
attachBtn('btn-bow', doBow);
attachBtn('btn-roll', doRoll);
attachBtn('btn-potion', doPotion);
attachBtn('art-1', () => useArtifact(1));
attachBtn('art-2', () => useArtifact(2));
attachBtn('art-3', () => useArtifact(3));

// Keyboard support
window.addEventListener('keydown', e => {
  AudioEngine.init();
  if (e.code === 'KeyW' || e.code === 'ArrowUp') joystickVector.y = -1;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') joystickVector.y = 1;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') joystickVector.x = -1;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') joystickVector.x = 1;
  if (e.code === 'Space') doRoll();
  if (e.code === 'KeyJ') doMelee();
  if (e.code === 'KeyK') doBow();
  if (e.code === 'KeyE') doPotion();
  if (e.code === 'Digit1') useArtifact(1);
  if (e.code === 'Digit2') useArtifact(2);
  if (e.code === 'Digit3') useArtifact(3);
  if (e.code === 'KeyR' && gameOver) revivePlayer();
});
window.addEventListener('keyup', e => {
  if (['KeyW','KeyS','ArrowUp','ArrowDown'].includes(e.code)) joystickVector.y = 0;
  if (['KeyA','KeyD','ArrowLeft','ArrowRight'].includes(e.code)) joystickVector.x = 0;
});

function revivePlayer() {
  gameOver = false;
  isLevelingUp = false;
  player.hp = player.maxHp;
  player.souls = 50;
  player.exp = 0;
  player.level = 1;
  player.maxExp = 40;
  player.weaponTier = 1;
  SKILL_DATABASE.forEach(s => player.perks[s.id] = 0);
  dungeonFloor = 1;
  enemies = [];
  drops = [];
  projectiles = [];
  updatePerksTray();
  document.getElementById('modal-gameover').style.display = 'none';
  spawnFloorWave();
}
document.getElementById('btn-revive').addEventListener('click', revivePlayer);

function drawPixelHero(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  // Drop shadow
  ctx.fillStyle = 'rgba(0, 30, 10, 0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 10, 14, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const angle = Math.atan2(p.facing.y, p.facing.x);
  const isMoving = Math.hypot(joystickVector.x, joystickVector.y) > 0.1 || p.rollTime > 0;
  const bob = isMoving ? Math.sin(p.walkCycle) * 3 : 0;
  const leg = isMoving ? Math.sin(p.walkCycle) * 5 : 0;

  // Blue Pants & Boots
  ctx.fillStyle = '#2980b9';
  ctx.fillRect(-8 + leg, 6, 6, 8);
  ctx.fillRect(2 - leg, 6, 6, 8);
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(-8 + leg, 12, 6, 4);
  ctx.fillRect(2 - leg, 12, 6, 4);

  // Torso / Iron Knight Armor
  ctx.fillStyle = p.shroomBuff > 0 ? '#e67e22' : '#bdc3c7';
  ctx.fillRect(-10, -8 + bob * 0.5, 20, 16);
  ctx.fillStyle = p.shroomBuff > 0 ? '#d35400' : '#7f8c8d';
  ctx.fillRect(-6, -4 + bob * 0.5, 12, 10);
  // Gold Belt
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(-8, 4 + bob * 0.5, 16, 4);

  // Knight Helmet & Face
  ctx.fillStyle = '#f5cd79'; // skin
  ctx.fillRect(-8, -20 + bob, 16, 14);
  ctx.fillStyle = '#7f8c8d'; // helmet
  ctx.fillRect(-9, -22 + bob, 18, 6);
  ctx.fillStyle = '#2c3e50'; // visor eye slit
  ctx.fillRect(-5 + (p.facing.x > 0 ? 3 : -3), -15 + bob, 8, 3);
  // Red feather on top of helmet
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(-2, -26 + bob, 4, 5);

  // Sword Hand
  ctx.save();
  ctx.translate(p.facing.x * 12, p.facing.y * 12);
  ctx.rotate(angle);
  // Diamond Blade
  ctx.fillStyle = p.perks.fire > 0 ? '#e67e22' : (p.weaponTier > 2 ? '#9b59b6' : '#00cec9');
  ctx.fillRect(2, -3, 16, 6);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(4, -1, 12, 2);
  // Guard & Hilt
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(0, -6, 3, 12);
  ctx.fillStyle = '#795548';
  ctx.fillRect(-4, -2, 4, 4);
  ctx.restore();

  ctx.restore();
}

// 2D PIXEL MONSTERS
function drawPixelZombie(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.fillStyle = 'rgba(0, 30, 10, 0.35)';
  ctx.beginPath(); ctx.ellipse(0, 9, 13, 5, 0, 0, Math.PI * 2); ctx.fill();

  const bob = Math.sin(en.walkCycle) * 2;
  const leg = Math.sin(en.walkCycle) * 4;

  ctx.fillStyle = en.freeze > 0 ? '#3498db' : '#222f3e';
  ctx.fillRect(-7 + leg, 6, 5, 7);
  ctx.fillRect(2 - leg, 6, 5, 7);

  // Cyan shirt
  ctx.fillStyle = en.burn > 0 ? '#e67e22' : (en.freeze > 0 ? '#74b9ff' : '#00cec9');
  ctx.fillRect(-8, -6 + bob * 0.5, 16, 14);

  // Green arms stretched forward
  ctx.fillStyle = en.burn > 0 ? '#d35400' : '#2ecc71';
  const dirX = en.facing.x >= 0 ? 1 : -1;
  ctx.fillRect(dirX * 6, -4 + bob * 0.5, dirX * 12, 5);

  // Head
  ctx.fillStyle = en.burn > 0 ? '#d35400' : '#2ecc71';
  ctx.fillRect(-7, -18 + bob, 14, 13);
  ctx.fillStyle = '#1e3799'; // dark hair
  ctx.fillRect(-7, -19 + bob, 14, 4);
  ctx.fillStyle = '#000'; // eyes
  ctx.fillRect(-4 + dirX * 2, -13 + bob, 3, 3);
  ctx.fillRect(2 + dirX * 2, -13 + bob, 3, 3);
  ctx.restore();
}

function drawPixelSkeleton(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.fillStyle = 'rgba(0, 30, 10, 0.35)';
  ctx.beginPath(); ctx.ellipse(0, 8, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

  const bob = Math.sin(en.walkCycle) * 2;
  const leg = Math.sin(en.walkCycle) * 4;

  ctx.fillStyle = en.freeze > 0 ? '#74b9ff' : '#dcdde1';
  ctx.fillRect(-6 + leg, 6, 4, 6);
  ctx.fillRect(2 - leg, 6, 4, 6);

  // Ribcage
  ctx.fillStyle = en.freeze > 0 ? '#74b9ff' : '#f5f6fa';
  ctx.fillRect(-7, -6 + bob * 0.5, 14, 12);
  ctx.fillStyle = '#2f3542';
  ctx.fillRect(-5, -3 + bob * 0.5, 10, 2);
  ctx.fillRect(-5, 1 + bob * 0.5, 10, 2);

  // Bow
  ctx.strokeStyle = '#8c5027';
  ctx.lineWidth = 2;
  const dirX = en.facing.x >= 0 ? 1 : -1;
  ctx.beginPath();
  ctx.arc(dirX * 8, 0, 8, -Math.PI * 0.45, Math.PI * 0.45);
  ctx.stroke();

  // Skull
  ctx.fillStyle = en.freeze > 0 ? '#74b9ff' : '#f5f6fa';
  ctx.fillRect(-7, -18 + bob, 14, 13);
  ctx.fillStyle = '#2f3542';
  ctx.fillRect(-5 + dirX * 2, -13 + bob, 3, 3);
  ctx.fillRect(1 + dirX * 2, -13 + bob, 3, 3);
  ctx.restore();
}

function drawPixelSlime(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.fillStyle = 'rgba(0, 30, 10, 0.35)';
  ctx.beginPath(); ctx.ellipse(0, 7, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

  const squish = Math.sin(en.walkCycle * 2) * 3;
  ctx.fillStyle = en.burn > 0 ? '#e67e22' : '#2ed573';
  ctx.fillRect(-10 - squish, -12 + squish, 20 + squish * 2, 16 - squish);
  ctx.fillStyle = en.burn > 0 ? '#d35400' : '#10ac84';
  ctx.fillRect(-6, -8 + squish, 12, 10 - squish);

  // Cute eyes
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-6, -9 + squish, 4, 4);
  ctx.fillRect(2, -9 + squish, 4, 4);
  ctx.fillStyle = '#000000';
  ctx.fillRect(-5, -8 + squish, 2, 2);
  ctx.fillRect(3, -8 + squish, 2, 2);
  ctx.restore();
}

function drawPixelCreeper(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.fillStyle = 'rgba(0, 30, 10, 0.35)';
  ctx.beginPath(); ctx.ellipse(0, 9, 13, 5, 0, 0, Math.PI * 2); ctx.fill();

  const isFusing = en.fuse > 0 && Math.floor(en.fuse / 4) % 2 === 0;
  ctx.fillStyle = isFusing ? '#ffffff' : (en.burn > 0 ? '#e67e22' : '#2ecc71');

  // 4 feet
  ctx.fillRect(-8, 5, 6, 6);
  ctx.fillRect(2, 5, 6, 6);

  // Body
  ctx.fillRect(-7, -7, 14, 14);

  // Head with Creeper Frown
  ctx.fillRect(-8, -21, 16, 15);
  ctx.fillStyle = isFusing ? '#ff4757' : '#000000';
  // Eyes
  ctx.fillRect(-5, -17, 3, 3);
  ctx.fillRect(2, -17, 3, 3);
  // Mouth
  ctx.fillRect(-2, -14, 4, 5);
  ctx.fillRect(-4, -11, 2, 4);
  ctx.fillRect(2, -11, 2, 4);

  ctx.restore();
}

function drawPixelSpider(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.fillStyle = 'rgba(0, 30, 10, 0.35)';
  ctx.beginPath(); ctx.ellipse(0, 5, 14, 6, 0, 0, Math.PI * 2); ctx.fill();

  const leg = Math.sin(en.walkCycle * 2) * 4;
  ctx.strokeStyle = '#2c3e50';
  ctx.lineWidth = 3;
  // 6 Spider legs
  ctx.beginPath();
  ctx.moveTo(-6, -2); ctx.lineTo(-15, -8 + leg);
  ctx.moveTo(-6, 2); ctx.lineTo(-16, 2 - leg);
  ctx.moveTo(-6, 6); ctx.lineTo(-14, 10 + leg);
  ctx.moveTo(6, -2); ctx.lineTo(15, -8 - leg);
  ctx.moveTo(6, 2); ctx.lineTo(16, 2 + leg);
  ctx.moveTo(6, 6); ctx.lineTo(14, 10 - leg);
  ctx.stroke();

  // Spider Body
  ctx.fillStyle = en.burn > 0 ? '#e67e22' : '#34495e';
  ctx.fillRect(-7, -5, 14, 12);
  // Head
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(-5, -11, 10, 7);
  // Red glowing eyes
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(-3, -9, 2, 2);
  ctx.fillRect(1, -9, 2, 2);
  ctx.restore();
}

function drawPixelWitch(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.fillStyle = 'rgba(0, 30, 10, 0.35)';
  ctx.beginPath(); ctx.ellipse(0, 8, 13, 5, 0, 0, Math.PI * 2); ctx.fill();

  // Purple Robe
  ctx.fillStyle = en.burn > 0 ? '#e67e22' : '#8e44ad';
  ctx.fillRect(-8, -6, 16, 16);

  // Pale Face & Big Nose
  ctx.fillStyle = '#d5dbdb';
  ctx.fillRect(-6, -16, 12, 11);
  ctx.fillStyle = '#bdc3c7';
  ctx.fillRect(-1, -12, 4, 5); // nose

  // Purple Witch Hat
  ctx.fillStyle = '#5b2c6f';
  ctx.fillRect(-11, -17, 22, 4); // brim
  ctx.fillRect(-6, -24, 12, 7);
  ctx.fillStyle = '#f1c40f'; // hat buckle
  ctx.fillRect(-3, -20, 6, 3);
  ctx.restore();
}

function drawPixelBoss(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.fillStyle = 'rgba(0, 30, 10, 0.45)';
  ctx.beginPath(); ctx.ellipse(0, 16, 26, 10, 0, 0, Math.PI * 2); ctx.fill();

  const bob = Math.sin(en.walkCycle) * 3;
  const fist = Math.sin(en.walkCycle) * 7;

  // Massive Obsidian Feet
  ctx.fillStyle = '#1e272e';
  ctx.fillRect(-18 + fist * 0.5, 10, 14, 10);
  ctx.fillRect(4 - fist * 0.5, 10, 14, 10);

  // Giant Torso
  ctx.fillStyle = en.burn > 0 ? '#d35400' : '#2f3542';
  ctx.fillRect(-22, -18 + bob, 44, 30);

  // Glowing Redstone Heart Core
  const glow = (Math.sin(Date.now() * 0.008) + 1) * 0.5;
  ctx.fillStyle = `rgba(235, 47, 6, ${0.7 + glow * 0.3})`;
  ctx.fillRect(-8, -10 + bob, 16, 16);

  // Heavy Fists
  ctx.fillStyle = '#485460';
  ctx.fillRect(-28, -8 + bob + fist, 12, 16);
  ctx.fillRect(16, -8 + bob - fist, 12, 16);

  // Skull Head with Horns
  ctx.fillStyle = '#1e272e';
  ctx.fillRect(-14, -32 + bob, 28, 16);
  ctx.fillStyle = '#ff4757'; // Horns
  ctx.fillRect(-16, -38 + bob, 6, 8);
  ctx.fillRect(10, -38 + bob, 6, 8);
  // Glowing Eyes
  ctx.fillStyle = '#ffa502';
  ctx.fillRect(-8, -26 + bob, 5, 4);
  ctx.fillRect(3, -26 + bob, 5, 4);

  ctx.restore();
}

// ENVIRONMENT DRAWING: BRIGHT GRASS, FLOWERS, TREES
function drawMeadowEnvironment() {
  // 1. Lush Green Grass Tile Background
  const tileSize = 48;
  for (let x = 0; x < W; x += tileSize) {
    for (let y = 0; y < H; y += tileSize) {
      const hash = Math.sin(x * 77 + y * 41) * 10000;
      const shade = Math.floor(Math.abs(hash) % 3);
      const grassColors = ['#2ecc71', '#27ae60', '#32d477'];
      ctx.fillStyle = grassColors[shade];
      ctx.fillRect(x, y, tileSize, tileSize);
    }
  }

  // 2. Cobblestone Patches
  stones.forEach(st => {
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(st.x, st.y, st.w, st.h);
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(st.x + 3, st.y + 3, st.w - 6, st.h - 6);
  });

  // 3. Flowers & Grass Tufts
  flowers.forEach(fl => {
    ctx.fillStyle = fl.color;
    if (fl.type === 3) {
      // Grass blades
      ctx.fillRect(fl.x, fl.y - 4, 2, 6);
      ctx.fillRect(fl.x + 3, fl.y - 6, 2, 8);
    } else {
      // Flower petals
      ctx.fillRect(fl.x - 2, fl.y - 2, 5, 5);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(fl.x - 1, fl.y - 1, 3, 3);
    }
  });

  // 4. Beautiful Pixel Trees
  trees.forEach(tr => {
    // Drop shadow
    ctx.fillStyle = 'rgba(0, 30, 10, 0.28)';
    ctx.beginPath();
    ctx.ellipse(tr.x, tr.y + tr.size * 0.8, tr.size * 0.85, tr.size * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wood Trunk
    ctx.fillStyle = '#795548';
    ctx.fillRect(tr.x - 5, tr.y - 6, 10, tr.size * 0.8);
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(tr.x - 2, tr.y - 6, 5, tr.size * 0.8);

    // Green Foliage Layers (Pixel Canopy)
    ctx.fillStyle = tr.darkShade;
    ctx.fillRect(tr.x - tr.size * 0.75, tr.y - tr.size * 1.3, tr.size * 1.5, tr.size * 1.2);
    ctx.fillStyle = tr.shade;
    ctx.fillRect(tr.x - tr.size * 0.65, tr.y - tr.size * 1.45, tr.size * 1.3, tr.size * 1.1);
    ctx.fillStyle = '#55efc4';
    ctx.fillRect(tr.x - tr.size * 0.35, tr.y - tr.size * 1.55, tr.size * 0.7, tr.size * 0.5);
  });
}

// ==========================================
// GAME UPDATE LOOP
// ==========================================
function update() {
  if (gameOver || isLevelingUp) return;

  const scalingLevel = (dungeonFloor - 1) * 1.5 + (player.level - 1) * 1.2;

  if (player.hp <= 0) {
    gameOver = true;
    document.getElementById('modal-gameover-desc').innerText =
      `Bạn đã chiến đấu dũng cảm đến Cấp ${player.level}, Tầng ${dungeonFloor} và thu thập được ${player.emeralds} Ngọc!`;
    document.getElementById('modal-gameover').style.display = 'flex';
    return;
  }

  // Ticks
  if (player.meleeCd > 0) player.meleeCd--;
  if (player.bowCd > 0) player.bowCd--;
  if (player.rollCd > 0) player.rollCd--;
  if (player.invulnTime > 0) player.invulnTime--;
  if (player.shroomBuff > 0) player.shroomBuff--;
  if (player.beaconTime > 0) player.beaconTime--;
  if (player.cdArt1 > 0) player.cdArt1--;
  if (player.cdArt2 > 0) player.cdArt2--;
  if (player.cdArt3 > 0) player.cdArt3--;
  if (player.potCd > 0) player.potCd--;

  // Perk: Call of Storm
  if (player.perks.stormCall > 0) {
    player.stormTimer++;
    if (player.stormTimer >= 180) {
      player.stormTimer = 0;
      const target = getClosestEnemy(500);
      if (target) {
        lightningArcs.push({ x1: target.x, y1: 0, x2: target.x, y2: target.y, life: 10 });
        applyDamage(target, 60 + player.weaponTier * 15);
        spawnParticles(target.x, target.y, '#f1c40f', 16);
      }
    }
  }

  // Perk: Spectral Glaive
  if (player.perks.glaive > 0) {
    player.glaiveAngle += 0.08;
    const gx = player.x + Math.cos(player.glaiveAngle) * 65;
    const gy = player.y + Math.sin(player.glaiveAngle) * 65;
    enemies.forEach(en => {
      if (Math.hypot(en.x - gx, en.y - gy) < 28) {
        applyDamage(en, 3.5 + player.weaponTier * 0.8);
        spawnParticles(gx, gy, '#70a1ff', 1);
      }
    });
  }

  // Movement
  const curSpeed = player.speed * (player.shroomBuff > 0 ? 1.45 : 1);
  if (player.rollTime > 0) {
    player.x += player.vx;
    player.y += player.vy;
    player.rollTime--;
  } else {
    player.x += joystickVector.x * curSpeed;
    player.y += joystickVector.y * curSpeed;
    if (Math.hypot(joystickVector.x, joystickVector.y) > 0.1) {
      player.walkCycle += 0.22;
    }
  }

  // Bounds
  player.x = Math.max(30, Math.min(W - 30, player.x));
  player.y = Math.max(30, Math.min(H - 30, player.y));

  // Beacon Beam Artifact
  if (player.beaconTime > 0) {
    let target = getClosestEnemy(420);
    let aimAngle = Math.atan2(player.facing.y, player.facing.x);
    if (target) aimAngle = Math.atan2(target.y - player.y, target.x - player.x);

    enemies.forEach(en => {
      const dist = Math.hypot(en.x - player.x, en.y - player.y);
      const enAngle = Math.atan2(en.y - player.y, en.x - player.x);
      let diff = Math.abs(enAngle - aimAngle);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;
      if (dist < 420 && diff < 0.22) {
        en.hp -= 3.5 + player.weaponTier * 0.8;
        spawnParticles(en.x, en.y, '#a29bfe', 1);
      }
    });
  }

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 10 || p.x > W - 10 || p.y < 10 || p.y > H - 10) {
      projectiles.splice(i, 1);
      continue;
    }

    if (p.friendly) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const en = enemies[j];
        if (Math.hypot(p.x - en.x, p.y - en.y) < en.size / 2 + 8) {
          applyDamage(en, p.dmg);
          spawnParticles(en.x, en.y, '#ffffff', 5);

          if (p.isFirework) {
            AudioEngine.playBlast();
            enemies.forEach(other => {
              if (Math.hypot(other.x - en.x, other.y - en.y) < 85) {
                applyDamage(other, p.dmg * 0.75);
              }
            });
            spawnParticles(en.x, en.y, '#ff4757', 24);
            spawnParticles(en.x, en.y, '#ffd32a', 16);
          }

          projectiles.splice(i, 1);
          break;
        }
      }
    } else {
      if (player.rollTime <= 0 && player.invulnTime <= 0 && Math.hypot(p.x - player.x, p.y - player.y) < player.size / 2 + 6) {
        let dmg = p.dmg;
        if (player.perks.thorns > 0) dmg *= 0.75;
        player.hp -= dmg;
        player.invulnTime = 25;
        spawnParticles(player.x, player.y, '#e74c3c', 7);
        projectiles.splice(i, 1);
      }
    }
  }

  // Poison Clouds
  for (let i = poisonClouds.length - 1; i >= 0; i--) {
    const pc = poisonClouds[i];
    pc.life--;
    if (pc.life <= 0) {
      poisonClouds.splice(i, 1);
      continue;
    }
    enemies.forEach(en => {
      if (Math.hypot(en.x - pc.x, en.y - pc.y) < pc.radius) {
        en.hp -= 0.35;
        if (Math.random() < 0.1) spawnParticles(en.x, en.y, '#2ecc71', 1);
      }
    });
  }

  // Enemies update
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];

    if (en.burn > 0) {
      en.burn--;
      en.hp -= 0.4;
      if (Math.random() < 0.2) spawnParticles(en.x, en.y, '#e67e22', 1);
    }
    if (en.freeze > 0) en.freeze--;

    if (en.hp <= 0) {
      const soulGain = player.perks.soulHarvest > 0 ? 30 : 16;
      player.souls = Math.min(player.maxSouls, player.souls + soulGain);
      addExp(en.type === 'boss' ? 40 : 10); // -5 EXP

      if (player.perks.corpseExplode > 0) {
        AudioEngine.playBlast();
        spawnParticles(en.x, en.y, '#e74c3c', 25);
        enemies.forEach(other => {
          if (other !== en && Math.hypot(other.x - en.x, other.y - en.y) < 95) {
            applyDamage(other, 35 + player.weaponTier * 10);
          }
        });
      }

      if (Math.random() < 0.75) drops.push({ x: en.x, y: en.y, type: 'emerald' });
      if (Math.random() < 0.35 || en.type === 'boss') drops.push({ x: en.x + 8, y: en.y, type: 'weapon' });
      spawnParticles(en.x, en.y, '#2ecc71', 14);
      enemies.splice(i, 1);
      continue;
    }

    const dist = Math.hypot(player.x - en.x, player.y - en.y);
    const angle = Math.atan2(player.y - en.y, player.x - en.x);
    en.facing = { x: Math.cos(angle), y: Math.sin(angle) };
    en.walkCycle += 0.16;
    const effectiveSpeed = en.freeze > 0 ? en.speed * 0.45 : en.speed;

    // Custom Monster Behaviors
    if (en.type === 'skeleton') {
      if (dist > 190) {
        en.x += Math.cos(angle) * effectiveSpeed;
        en.y += Math.sin(angle) * effectiveSpeed;
      }
      en.shootCd--;
      if (en.shootCd <= 0) {
        en.shootCd = en.freeze > 0 ? 190 : Math.max(65, 130 - Math.floor(scalingLevel * 4));
        projectiles.push({
          x: en.x, y: en.y,
          vx: Math.cos(angle) * (5.2 + scalingLevel * 0.15),
          vy: Math.sin(angle) * (5.2 + scalingLevel * 0.15),
          dmg: 7 + Math.floor(scalingLevel * 2.2),
          friendly: false, color: '#ecf0f1'
        });
      }
    } else if (en.type === 'witch') {
      if (dist > 210) {
        en.x += Math.cos(angle) * effectiveSpeed;
        en.y += Math.sin(angle) * effectiveSpeed;
      }
      en.shootCd--;
      if (en.shootCd <= 0) {
        en.shootCd = Math.max(70, 120 - Math.floor(scalingLevel * 3));
        projectiles.push({
          x: en.x, y: en.y,
          vx: Math.cos(angle) * (4.5 + scalingLevel * 0.12),
          vy: Math.sin(angle) * (4.5 + scalingLevel * 0.12),
          dmg: 10 + Math.floor(scalingLevel * 2.4),
          friendly: false, color: '#9b59b6'
        });
      }
    } else if (en.type === 'creeper') {
      // Creeper approaches and starts fuse explosion!
      if (dist < 55) {
        en.fuse++;
        if (en.fuse > 50) {
          // Boom!
          AudioEngine.playBlast();
          spawnParticles(en.x, en.y, '#e74c3c', 35);
          if (Math.hypot(player.x - en.x, player.y - en.y) < 75 && player.rollTime <= 0 && player.invulnTime <= 0) {
            let cDmg = 25 + scalingLevel * 3.5;
            if (player.perks.thorns > 0) cDmg *= 0.75;
            player.hp -= cDmg;
            player.invulnTime = 30;
          }
          enemies.splice(i, 1);
          continue;
        }
      } else {
        en.x += Math.cos(angle) * effectiveSpeed;
        en.y += Math.sin(angle) * effectiveSpeed;
        if (en.fuse > 0) en.fuse--;
      }
    } else if (en.type === 'slime') {
      // Slime hops
      en.hopTimer = (en.hopTimer || 0) + 1;
      if (en.hopTimer % 40 < 20) {
        en.x += Math.cos(angle) * (effectiveSpeed * 1.5);
        en.y += Math.sin(angle) * (effectiveSpeed * 1.5);
      }
    } else if (en.type === 'boss') {
      en.x += Math.cos(angle) * effectiveSpeed;
      en.y += Math.sin(angle) * effectiveSpeed;
      en.shootCd--;
      if (en.shootCd <= 0) {
        en.shootCd = Math.max(65, 110 - Math.floor(scalingLevel * 3));
        for (let k = -1; k <= 1; k++) {
          projectiles.push({
            x: en.x, y: en.y,
            vx: Math.cos(angle + k * 0.28) * (5.5 + scalingLevel * 0.12),
            vy: Math.sin(angle + k * 0.28) * (5.5 + scalingLevel * 0.12),
            dmg: 12 + Math.floor(scalingLevel * 2.8),
            friendly: false, color: '#e74c3c'
          });
        }
      }
    } else {
      // Zombie / Spider
      en.x += Math.cos(angle) * effectiveSpeed;
      en.y += Math.sin(angle) * effectiveSpeed;
    }

    // Touch Collision
    if (player.rollTime <= 0 && player.invulnTime <= 0 && dist < (player.size + en.size) / 2) {
      let dmg = (9 + scalingLevel * 2.2);
      if (player.perks.thorns > 0) {
        dmg *= 0.75;
        en.hp -= 18;
      }
      player.hp -= dmg;
      player.invulnTime = 30;
      player.x += Math.cos(angle + Math.PI) * 16;
      player.y += Math.sin(angle + Math.PI) * 16;
      spawnParticles(player.x, player.y, '#e74c3c', 6);
    }
  }

  // Drops pickup
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (Math.hypot(player.x - d.x, player.y - d.y) < 38) {
      AudioEngine.playPickup();
      if (d.type === 'emerald') player.emeralds += 8;
      if (d.type === 'weapon') player.weaponTier++;
      spawnParticles(d.x, d.y, '#2ecc71', 8);
      drops.splice(i, 1);
    }
  }

  if (enemies.length === 0) {
    dungeonFloor++;
    player.hp = Math.min(player.maxHp, player.hp + 25);
    spawnFloorWave();
  }

  // FX & Texts
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx;
    particles[i].y += particles[i].vy;
    particles[i].life--;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (let i = slashArcs.length - 1; i >= 0; i--) {
    slashArcs[i].life--;
    if (slashArcs[i].life <= 0) slashArcs.splice(i, 1);
  }
  for (let i = lightningArcs.length - 1; i >= 0; i--) {
    lightningArcs[i].life--;
    if (lightningArcs[i].life <= 0) lightningArcs.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y += floatingTexts[i].vy;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }

  // Update HUD
  document.getElementById('hp-bar').style.width = Math.max(0, (player.hp / player.maxHp * 100)) + '%';
  document.getElementById('soul-bar').style.width = Math.max(0, (player.souls / player.maxSouls * 100)) + '%';
  document.getElementById('exp-bar').style.width = Math.min(100, Math.max(0, (player.exp / player.maxExp * 100))) + '%';
  document.getElementById('txt-lvl').innerText = player.level;
  document.getElementById('txt-floor').innerText = dungeonFloor;
  document.getElementById('txt-emerald').innerText = player.emeralds;

  document.getElementById('cd-roll').style.height = (player.rollCd / player.maxRollCd * 100) + '%';
  document.getElementById('cd-pot').style.height = (player.potCd / player.maxPotCd * 100) + '%';
  document.getElementById('cd-art-1').style.height = (player.cdArt1 / player.maxCdArt1 * 100) + '%';
  document.getElementById('cd-art-2').style.height = (player.cdArt2 / player.maxCdArt2 * 100) + '%';
  document.getElementById('cd-art-3').style.height = (player.cdArt3 / player.maxCdArt3 * 100) + '%';
}

// ==========================================
// RENDER LOOP (2D BRIGHT PIXEL ART)
// ==========================================
function draw() {
  ctx.clearRect(0, 0, W, H);

  // 1. Draw Bright Meadow, Flowers, Cobblestones, Trees
  drawMeadowEnvironment();

  // 2. Poison Clouds
  poisonClouds.forEach(pc => {
    ctx.save();
    ctx.fillStyle = 'rgba(46, 204, 113, 0.3)';
    ctx.beginPath();
    ctx.arc(pc.x, pc.y, pc.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 3. Item Drops
  drops.forEach(d => {
    const bob = Math.sin(Date.now() * 0.008 + d.x) * 3;
    if (d.type === 'emerald') {
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(d.x - 7, d.y - 7 + bob, 14, 14);
      ctx.fillStyle = '#a8e6cf';
      ctx.fillRect(d.x - 3, d.y - 3 + bob, 6, 6);
    } else {
      ctx.fillStyle = '#9b59b6';
      ctx.fillRect(d.x - 7, d.y - 7 + bob, 14, 14);
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(d.x - 2, d.y - 6 + bob, 4, 12);
      ctx.fillRect(d.x - 6, d.y - 2 + bob, 12, 4);
    }
  });

  // 4. Artifact Beacon Beam
  if (player.beaconTime > 0) {
    let target = getClosestEnemy(420);
    let aimAngle = Math.atan2(player.facing.y, player.facing.x);
    if (target) aimAngle = Math.atan2(target.y - player.y, target.x - player.x);

    ctx.save();
    ctx.strokeStyle = 'rgba(162, 155, 254, 0.88)';
    ctx.lineWidth = 16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + Math.cos(aimAngle) * 420, player.y + Math.sin(aimAngle) * 420);
    ctx.stroke();
    ctx.restore();
  }

  // 5. Lightning Arcs
  lightningArcs.forEach(l => {
    ctx.save();
    ctx.strokeStyle = '#ffd32a';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo((l.x1 + l.x2) / 2 + (Math.random() - 0.5) * 25, (l.y1 + l.y2) / 2 + (Math.random() - 0.5) * 25);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
    ctx.restore();
  });

  // 6. Slash Arcs
  slashArcs.forEach(s => {
    ctx.save();
    ctx.strokeStyle = player.perks.fire > 0 ? 'rgba(230, 126, 34, 0.9)' : 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    if (s.swirling) {
      ctx.arc(s.x, s.y, 65, 0, Math.PI * 2);
    } else {
      ctx.arc(s.x, s.y, 52, s.angle - 0.85, s.angle + 0.85);
    }
    ctx.stroke();
    ctx.restore();
  });

  // 7. Spectral Glaive
  if (player.perks.glaive > 0) {
    const gx = player.x + Math.cos(player.glaiveAngle) * 65;
    const gy = player.y + Math.sin(player.glaiveAngle) * 65;
    ctx.save();
    ctx.fillStyle = '#70a1ff';
    ctx.shadowColor = '#70a1ff';
    ctx.shadowBlur = 10;
    ctx.fillRect(gx - 6, gy - 6, 12, 12);
    ctx.restore();
  }

  // 8. Draw Monsters
  enemies.forEach(en => {
    if (en.type === 'boss') drawPixelBoss(en);
    else if (en.type === 'skeleton') drawPixelSkeleton(en);
    else if (en.type === 'slime') drawPixelSlime(en);
    else if (en.type === 'creeper') drawPixelCreeper(en);
    else if (en.type === 'spider') drawPixelSpider(en);
    else if (en.type === 'witch') drawPixelWitch(en);
    else drawPixelZombie(en);

    // HP Mini Bar
    ctx.fillStyle = '#000';
    ctx.fillRect(en.x - 16, en.y - en.size / 2 - 12, 32, 4);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(en.x - 16, en.y - en.size / 2 - 12, 32 * Math.max(0, en.hp / en.maxHp), 4);
  });

  // 9. Draw Player
  if (player.invulnTime % 4 < 2) {
    drawPixelHero(player);
  }

  // 10. Projectiles (Arrows & Magic Orbs)
  projectiles.forEach(p => {
    ctx.save();
    if (p.friendly) {
      const angle = Math.atan2(p.vy, p.vx);
      ctx.translate(p.x, p.y);
      ctx.rotate(angle);
      ctx.fillStyle = '#8c5027';
      ctx.fillRect(-10, -2, 18, 4);
      ctx.fillStyle = p.color;
      ctx.fillRect(6, -3, 6, 6);
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
    }
    ctx.restore();
  });

  // 11. Particles
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6);
  });

  // 12. Damage Floating Text
  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

spawnFloorWave();
gameLoop();
</script>
